function setupRun(){const b=getBonuses();attackPower=14+b.atk*.55;maxHp=100+b.hp*1.25;hp=maxHp;cooldownMult=Math.max(.35,1-Math.min(.65,b.cdr))}function startRun(){setupRun();reset();document.getElementById('lobby').classList.add('hidden');document.getElementById('battleLayer').classList.remove('hidden');running=true}document.getElementById('startBattle').onclick=startRun;function spawn(){let s=Math.floor(Math.random()*4),m=28+wave*3,e={x:0,y:0,r:15+Math.random()*8,hp:m,maxHp:m,spd:38+Math.random()*30+wave*1.7,damage:18+wave*.4,boss:false};if(s===0){e.x=rand(0,W);e.y=-30}else if(s===1){e.x=W+30;e.y=rand(40,H-100)}else if(s===2){e.x=rand(0,W);e.y=H+30}else{e.x=-30;e.y=rand(40,H-100)}enemies.push(e)}function spawnBoss(l){let m=250+l*130,e={x:W/2,y:-60,r:42+Math.min(12,(l-1)*2),hp:m,maxHp:m,spd:34+(l-1)*3,damage:30+(l-1)*4,boss:true};enemies.push(e);activeBoss=e}function nearest(f){let b=null,d=1e9;for(const e of enemies){let q=dist(f,e);if(q<d){d=q;b=e}}return b}function shoot(f,tg,dmg=14,s=430,k='star'){if(!tg)return;let a=Math.atan2(tg.y-f.y,tg.x-f.x);bullets.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:5,dmg,life:2,kind:k})}function burst(px,py,n=14,color='#ffcf4c'){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,sp=rand(40,180);fx.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.3,.8),max:1,color})}}function ringFx(px,py,color='#ffdf61',life=.65){fx.push({ring:true,x:px,y:py,life,max:life,color})}function giftDmg(m){return Math.round((attackPower+wave*.4)*m)}function useGift(){let cd=cooldownBase*cooldownMult;if(!running||t-lastGift<cd)return;lastGift=t;let r=Math.floor(Math.random()*10),tg=nearest(santa);if(r===0&&tg){document.getElementById('event').textContent='💥 폭발 선물!';tg.hp-=giftDmg(4);ringFx(tg.x,tg.y,'#ffd661');burst(tg.x,tg.y,28,'#ffd661')}else if(r===1){document.getElementById('event').textContent='🧒 아이 소환!';kids.push({x:santa.x,y:santa.y,life:14,last:0,type:'kid'});ringFx(santa.x,santa.y,'#55c7ff');burst(santa.x,santa.y,18,'#55c7ff')}else if(r===2){document.getElementById('event').textContent='🌧️ 총알비!';ringFx(santa.x,santa.y,'#ffe55f');for(let i=0;i<30;i++)bullets.push({x:rand(0,W),y:-20-rand(0,180),vx:0,vy:rand(420,620),r:4,dmg:giftDmg(1.6),life:2.5,kind:'rain'})}else if(r===3){document.getElementById('event').textContent='👊 근접 난타!';ringFx(santa.x,santa.y,'#fff58f');burst(santa.x,santa.y,24,'#fff58f');for(const e of enemies)if(dist(santa,e)<125)e.hp-=giftDmg(5)}else if(r===4){document.getElementById('event').textContent='❄️ 눈보라!';ringFx(santa.x,santa.y,'#b7efff',1);for(let i=0;i<55;i++)fx.push({x:rand(0,W),y:rand(0,H),vx:rand(-30,30),vy:rand(20,80),life:rand(.5,1.2),max:1,color:'#dff7ff'});for(const e of enemies){e.hp-=giftDmg(2);e.spd*=.5}}else if(r===5){document.getElementById('event').textContent='🦌 순록 돌진!';let a=tg?Math.atan2(tg.y-santa.y,tg.x-santa.x):-Math.PI/2;for(let d=40;d<360;d+=45){let px=santa.x+Math.cos(a)*d,py=santa.y+Math.sin(a)*d;ringFx(px,py,'#ffdd8a',.35)}for(const e of enemies)if(dist(santa,e)<220)e.hp-=giftDmg(2.5)}else if(r===6){document.getElementById('event').textContent='🎁💣 거대 선물폭탄!';ringFx(W/2,H*.45,'#ff89d8',1);burst(W/2,H*.45,60,'#ff76bf');for(const e of enemies)e.hp-=giftDmg(6)}else if(r===7){document.getElementById('event').textContent='🛡️ 보호막!';shield=8;ringFx(santa.x,santa.y,'#79ecff',.8)}else if(r===8){document.getElementById('event').textContent='🍬 사탕 지뢰!';ringFx(santa.x,santa.y,'#ff9ce4');for(let i=0;i<6;i++)mines.push({x:santa.x+rand(-140,140),y:santa.y+rand(-140,140),r:13,life:12})}else{document.getElementById('event').textContent='🧝 엘프 지원!';kids.push({x:santa.x,y:santa.y,life:16,last:0,type:'elf'});ringFx(santa.x,santa.y,'#67f0a3');burst(santa.x,santa.y,18,'#67f0a3')}}document.getElementById('gift').addEventListener('pointerdown',e=>{e.preventDefault();useGift()});
function reset(){t=0;kill=0;wave=1;shield=0;lastBossWave=0;bossCount=0;activeBoss=null;enemies=[];bullets=[];fx=[];kids=[];mines=[];lootDrops=[];santa.x=W/2;santa.y=H*.62;lastGift=-999;lastSpawn=0;lastAuto=0;document.getElementById('bossWrap').style.display='none'}let joy={dx:0,dy:0},j=document.getElementById('joy'),nub=document.getElementById('nub');function jm(e){const r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),m=r.width*.34;if(d>m){dx*=m/d;dy*=m/d}joy.dx=dx/m;joy.dy=dy/m;nub.style.transform=`translate(${dx}px,${dy}px)`}j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);jm(e)};j.onpointermove=e=>{if(e.buttons)jm(e)};j.onpointerup=()=>{joy.dx=joy.dy=0;nub.style.transform='translate(0,0)'};const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')useGift()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function finishRun(){running=false;renderLobby();setTimeout(()=>{document.getElementById('battleLayer').classList.add('hidden');document.getElementById('lobby').classList.remove('hidden')},500)}function update(dt){t+=dt;wave=1+Math.floor(kill/18);if(shield>0)shield-=dt;if(wave%10===0&&lastBossWave!==wave){lastBossWave=wave;bossCount++;spawnBoss(bossCount)}let gap=Math.max(.15,.86-wave*.04),batch=Math.min(1+Math.floor((wave-1)/3),7);if(t-lastSpawn>gap){lastSpawn=t;if(!(activeBoss&&activeBoss.hp>0))for(let i=0;i<batch;i++)spawn()}let mx=joy.dx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=joy.dy+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}santa.x=Math.max(28,Math.min(W-28,santa.x+mx*santa.speed*dt));santa.y=Math.max(70,Math.min(H-40,santa.y+my*santa.speed*dt));if(t-lastAuto>.42){lastAuto=t;shoot(santa,nearest(santa),attackPower+wave*.4,480)}for(const k of kids){k.life-=dt;if(t-k.last>(k.type==='elf'?.28:.55)){k.last=t;shoot(k,nearest(k),attackPower*(k.type==='elf'?.65:.9),500,k.type)}}kids=kids.filter(k=>k.life>0);for(const e of enemies){let a=Math.atan2(santa.y-e.y,santa.x-e.x);e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt;if(dist(santa,e)<santa.r+e.r&&shield<=0)hp-=e.damage*dt}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.hp-=b.dmg;b.life=0;break}}bullets=bullets.filter(b=>b.life>0);for(const m of mines){m.life-=dt;for(const e of enemies)if(dist(m,e)<m.r+e.r){e.hp-=giftDmg(5);m.life=0;break}}mines=mines.filter(m=>m.life>0);for(const f of fx){f.life-=dt;if(!f.ring){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96}}fx=fx.filter(f=>f.life>0);for(const d of lootDrops){d.life-=dt;if(dist(santa,d)<30){gainLoot(d.item);d.life=0}}lootDrops=lootDrops.filter(d=>d.life>0);let s=[];activeBoss=null;for(const e of enemies){if(e.hp<=0){kill+=e.boss?5:1;if(Math.random()<lootDropChance(e.boss))lootDrops.push({x:e.x,y:e.y,r:14,life:12,item:createEquipment(e.boss),boss:e.boss})}else{s.push(e);if(e.boss)activeBoss=e}}enemies=s;document.getElementById('score').textContent=`처치 ${kill} · WAVE ${wave}`;document.getElementById('hp').style.width=Math.max(0,hp/maxHp*100)+'%';let rem=Math.max(0,cooldownBase*cooldownMult-(t-lastGift));document.getElementById('cool').textContent=rem?`재사용 ${rem.toFixed(1)}초`:'랜덤 선물 공격';if(activeBoss){document.getElementById('bossWrap').style.display='block';document.getElementById('bossHp').style.width=Math.max(0,activeBoss.hp/activeBoss.maxHp*100)+'%'}else document.getElementById('bossWrap').style.display='none';if(hp<=0)finishRun()}function draw(){x.clearRect(0,0,W,H);for(const s of snow){s.y+=.5;if(s.y>H)s.y=0;circle(s.x,s.y,s.s,'#fff')}for(const d of lootDrops){circle(d.x,d.y,d.r,d.boss?'#ffd756':'#7cf0ff');x.font='18px sans-serif';x.textAlign='center';x.fillText('📦',d.x,d.y)}x.font='44px sans-serif';x.textAlign='center';x.fillText('🎅',santa.x,santa.y);for(const e of enemies){x.font=(e.boss?58:30)+'px sans-serif';x.fillText(e.boss?'👹':'👹',e.x,e.y);if(e.boss){x.font='20px sans-serif';x.fillText('👑',e.x,e.y-e.r-10)}}for(const k of kids){circle(k.x,k.y,15,k.type==='elf'?'#57e389':'#55c7ff');x.font='20px sans-serif';x.fillText(k.type==='elf'?'🧝':'🧒',k.x,k.y)}for(const b of bullets){if(b.kind==='rain'){x.fillStyle='#ffe55f';x.fillRect(b.x-2,b.y-9,4,18)}else circle(b.x,b.y,b.r,b.kind==='elf'?'#67f0a3':b.kind==='kid'?'#63d7ff':'#ffd84f')}for(const m of mines){circle(m.x,m.y,m.r,'#d83b5c');x.font='18px sans-serif';x.fillText('🍬',m.x,m.y)}for(const f of fx){let a=Math.max(0,f.life/(f.max||1));x.globalAlpha=Math.min(1,a);if(f.ring){x.strokeStyle=f.color||'#ffdf61';x.lineWidth=9;x.shadowColor=f.color||'#ffdf61';x.shadowBlur=16;x.beginPath();x.arc(f.x,f.y,(1-a)*165+18,0,Math.PI*2);x.stroke();x.shadowBlur=0}else circle(f.x,f.y,4,f.color||'#ffcf4c')}x.globalAlpha=1;if(shield>0){x.strokeStyle='rgba(120,220,255,.95)';x.lineWidth=5;x.beginPath();x.arc(santa.x,santa.y,santa.r+15,0,Math.PI*2);x.stroke()}}let prev=performance.now();function loop(now){let dt=Math.min(.033,(now-prev)/1000);prev=now;if(running){update(dt);draw()}requestAnimationFrame(loop)}renderLobby();renderInventory();requestAnimationFrame(loop);
</script></div></body></html>
